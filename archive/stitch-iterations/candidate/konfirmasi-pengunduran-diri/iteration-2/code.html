<!DOCTYPE html>

<html lang="id"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .modal-backdrop {
            backdrop-filter: blur(4px);
            background-color: rgba(0, 0, 0, 0.4);
        }
    </style>
</head>
<body class="bg-background min-h-screen font-body-md text-on-surface antialiased flex items-center justify-center">
<!-- Modal Overlay -->
<div class="fixed inset-0 z-50 flex items-center justify-center modal-backdrop p-margin-mobile md:p-0">
<!-- Modal Container -->
<div aria-labelledby="modal-title" aria-modal="true" class="bg-surface-container-lowest rounded-xl shadow-lg w-full max-w-[480px] overflow-hidden flex flex-col relative animate-fade-in-up" role="dialog">
<!-- Close Button (Top Right) -->
<button aria-label="Tutup modal" class="absolute top-4 right-4 text-on-surface-variant hover:text-on-surface transition-colors p-2 rounded-full hover:bg-surface-container-low">
<span class="material-symbols-outlined" data-icon="close">close</span>
</button>
<!-- Modal Content -->
<div class="p-6 md:p-8 flex flex-col gap-6">
<!-- Header: Icon & Title -->
<div class="flex flex-col items-center text-center gap-4">
<div class="w-12 h-12 rounded-full bg-error-container flex items-center justify-center text-on-error-container">
<span class="material-symbols-outlined !text-3xl" data-icon="warning" data-weight="fill" style="font-variation-settings: 'FILL' 1;">warning</span>
</div>
<div>
<h2 class="font-headline-md text-headline-md text-on-surface mb-2" id="modal-title">Mengundurkan Diri?</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Anda akan keluar dari proses rekrutmen ini secara permanen. Tindakan ini tidak dapat dibatalkan dan aplikasi Anda akan dihapus dari tinjauan rekruter.</p>
</div>
</div>
<!-- Input Area -->
<div class="flex flex-col gap-2">
<label class="font-label-md text-label-md text-on-surface" for="reason">Alasan Pengunduran Diri (Opsional)</label>
<textarea class="w-full rounded-lg border border-outline-variant bg-surface px-4 py-3 font-body-md text-body-md text-on-surface placeholder:text-on-surface-variant/50 focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none resize-none transition-colors" id="reason" placeholder="Tuliskan alasan Anda di sini..." rows="4"></textarea>
</div>
<!-- Actions -->
<div class="flex flex-col-reverse sm:flex-row gap-3 sm:justify-end mt-2">
<button class="px-6 py-2.5 rounded-lg font-label-md text-label-md text-on-surface-variant hover:bg-surface-container-low hover:text-on-surface transition-colors border border-outline-variant sm:border-transparent" type="button">
                        Batal
                    </button>
<button class="px-6 py-2.5 rounded-lg font-label-md text-label-md bg-error text-on-error hover:bg-on-error-container transition-colors shadow-sm flex items-center justify-center gap-2" type="button">
                        Konfirmasi Pengunduran Diri
                    </button>
</div>
</div>
</div>
</div>
<script>
        // Simple animation logic for the modal appearance
        document.addEventListener('DOMContentLoaded', () => {
            const modalContainer = document.querySelector('[role="dialog"]');
            if(modalContainer) {
                modalContainer.style.opacity = '0';
                modalContainer.style.transform = 'translateY(20px)';
                
                requestAnimationFrame(() => {
                    modalContainer.style.transition = 'opacity 0.3s ease-out, transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
                    modalContainer.style.opacity = '1';
                    modalContainer.style.transform = 'translateY(0)';
                });
            }
        });
    </script>
</body></html>
