<!DOCTYPE html>

<html lang="id"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Modal Pengunduran Diri - Portal Karir</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "error": "#E11B22",
                        "error-container": "#ffdad6",
                        "on-primary": "#ffffff",
                        "primary-fixed-dim": "#adc7f7",
                        "primary-fixed": "#d6e3ff",
                        "on-error-container": "#93000a",
                        "inverse-surface": "#2d3133",
                        "surface-variant": "#e0e3e5",
                        "inverse-primary": "#adc7f7",
                        "on-primary-fixed": "#001b3c",
                        "surface-container": "#ebeef0",
                        "secondary-container": "#66affe",
                        "on-tertiary-fixed": "#271900",
                        "on-primary-fixed-variant": "#2d476f",
                        "on-secondary-fixed-variant": "#00497e",
                        "outline": "#74777f",
                        "on-surface-variant": "#43474e",
                        "on-secondary": "#ffffff",
                        "secondary": "#0061a5",
                        "success": "#38a169",
                        "on-tertiary-container": "#cb9524",
                        "on-secondary-container": "#004172",
                        "background": "#f7fafc",
                        "on-background": "#181c1e",
                        "tertiary-container": "#493100",
                        "on-secondary-fixed": "#001d37",
                        "secondary-fixed": "#d2e4ff",
                        "on-error": "#ffffff",
                        "surface-bright": "#f7fafc",
                        "primary-container": "#1a365d",
                        "surface-container-high": "#e5e9eb",
                        "surface-tint": "#455f88",
                        "secondary-fixed-dim": "#9fcaff",
                        "tertiary-fixed": "#ffdeaa",
                        "surface-container-low": "#f1f4f6",
                        "primary": "#002045",
                        "tertiary": "#2d1d00",
                        "outline-variant": "#c4c6cf",
                        "surface-dim": "#d7dadc",
                        "on-surface": "#181c1e",
                        "on-tertiary": "#ffffff",
                        "on-tertiary-fixed-variant": "#5f4100",
                        "inverse-on-surface": "#eef1f3",
                        "surface-container-highest": "#e0e3e5",
                        "surface-container-lowest": "#ffffff",
                        "on-primary-container": "#86a0cd",
                        "tertiary-fixed-dim": "#f8bc4b",
                        "deep-navy": "#1B2D4F",
                        "surface": "#ffffff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "gutter": "24px",
                        "margin-mobile": "16px",
                        "margin-desktop": "48px",
                        "container-max": "1280px",
                        "base": "4px"
                    },
                    "fontFamily": {
                        "headline-lg": ["Inter"],
                        "body-lg": ["Inter"],
                        "title-lg": ["Inter"],
                        "headline-md": ["Inter"],
                        "body-md": ["Inter"],
                        "headline-lg-mobile": ["Inter"],
                        "display-lg": ["Inter"],
                        "label-sm": ["Inter"],
                        "label-md": ["Inter"]
                    },
                    "fontSize": {
                        "headline-lg": ["32px", { "lineHeight": "40px", "fontWeight": "700" }],
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],
                        "title-lg": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "headline-lg-mobile": ["24px", { "lineHeight": "32px", "fontWeight": "700" }],
                        "display-lg": ["48px", { "lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "label-sm": ["12px", { "lineHeight": "16px", "fontWeight": "500" }],
                        "label-md": ["14px", { "lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "600" }]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        [data-weight="fill"] {
            font-variation-settings: 'FILL' 1;
        }
        
        /* Modal Backdrop Blur Effect */
        .modal-backdrop {
            backdrop-filter: blur(4px);
            background-color: rgba(0, 0, 0, 0.4);
        }
    </style>
</head>
<body class="bg-background text-on-background font-body-md h-screen flex items-center justify-center relative overflow-hidden">
<!-- Mock Background Content to show context -->
<div class="absolute inset-0 z-0 opacity-50 flex flex-col p-margin-desktop gap-gutter max-w-container-max mx-auto w-full">
<div class="h-16 bg-surface border-b border-outline-variant flex items-center px-4 rounded-lg">
<div class="w-48 h-6 bg-surface-container-highest rounded"></div>
</div>
<div class="flex gap-gutter flex-1">
<div class="w-64 bg-surface border border-outline-variant rounded-lg p-4 flex flex-col gap-4">
<div class="w-full h-8 bg-surface-container-highest rounded"></div>
<div class="w-full h-8 bg-surface-container-highest rounded"></div>
</div>
<div class="flex-1 bg-surface border border-outline-variant rounded-lg p-6">
<div class="w-1/3 h-10 bg-surface-container-highest rounded mb-6"></div>
<div class="w-full h-32 bg-surface-container-highest rounded mb-4"></div>
<div class="w-full h-32 bg-surface-container-highest rounded"></div>
</div>
</div>
</div>
<!-- Modal Overlay -->
<div aria-labelledby="modal-title" aria-modal="true" class="fixed inset-0 z-50 modal-backdrop flex items-center justify-center p-margin-mobile md:p-margin-desktop" role="dialog">
<!-- Modal Content Canvas -->
<div class="bg-surface w-full max-w-lg rounded-xl shadow-[0_8px_20px_rgba(0,32,69,0.05)] border border-outline-variant flex flex-col overflow-hidden transform transition-all scale-100 opacity-100">
<!-- Header -->
<div class="flex justify-between items-start p-6 pb-4 border-b border-surface-container-highest bg-surface-container-lowest">
<div class="flex items-center gap-3">
<div class="w-10 h-10 rounded-full bg-error-container flex items-center justify-center text-error">
<span class="material-symbols-outlined" data-icon="warning" data-weight="fill">warning</span>
</div>
<h2 class="font-title-lg text-title-lg text-on-surface" id="modal-title">Mengundurkan Diri?</h2>
</div>
<button aria-label="Tutup" class="text-on-surface-variant hover:text-on-surface hover:bg-surface-container-highest rounded-full p-1 transition-colors" type="button">
<span class="material-symbols-outlined" data-icon="close">close</span>
</button>
</div>
<!-- Body -->
<div class="p-6 flex flex-col gap-6">
<p class="font-body-md text-body-md text-on-surface-variant">
                    Anda akan keluar dari proses rekrutmen ini secara permanen. Tindakan ini tidak dapat dibatalkan dan aplikasi Anda akan ditarik.
                </p>
<div class="flex flex-col gap-2">
<label class="font-label-md text-label-md text-on-surface" for="reason">Alasan <span class="text-on-surface-variant font-normal">(opsional)</span></label>
<textarea class="w-full rounded-lg border-outline-variant bg-surface text-on-surface focus:border-primary focus:ring focus:ring-primary-fixed-dim/30 placeholder:text-outline p-3 font-body-md text-body-md resize-none transition-shadow" id="reason" name="reason" placeholder="Beritahu kami alasan pengunduran diri Anda..." rows="3"></textarea>
</div>
</div>
<!-- Footer / Actions -->
<div class="p-6 pt-4 bg-surface-container-lowest flex flex-col-reverse sm:flex-row justify-end gap-3 rounded-b-xl">
<button class="px-6 py-2.5 rounded-lg border border-outline-variant bg-surface text-on-surface font-label-md text-label-md hover:bg-surface-container-low hover:text-primary transition-colors focus:ring-2 focus:ring-primary-fixed-dim outline-none text-center" type="button">
                    Batal
                </button>
<button class="px-6 py-2.5 rounded-lg bg-error text-on-error font-label-md text-label-md hover:bg-on-error-container hover:shadow-sm transition-all focus:ring-2 focus:ring-error-container outline-none flex items-center justify-center gap-2" type="button">
<span class="material-symbols-outlined text-[18px]" data-icon="logout">logout</span>
                    Konfirmasi Pengunduran Diri
                </button>
</div>
</div>
</div>
</body></html>
