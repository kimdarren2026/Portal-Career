# Portal Karir Kampus — nginx front for the PHP-FPM web role
# (DEPLOYMENT_ARCHITECTURE.md §2, §6). Runs beside the runtime image's php-fpm
# process (same release). TLS, HSTS, CSP and coarse rate limiting live one hop
# further out at the edge load balancer; this file is the app-tier vhost.

server {
    listen 8080;
    server_name _;
    root /var/www/app/public;
    index index.php;

    charset utf-8;

    # Transport ceiling ABOVE the 10 MiB candidate-document business limit, so
    # an oversized upload reaches the application and gets the frozen
    # 413 PAYLOAD_TOO_LARGE envelope, not a bare nginx error.
    client_max_body_size 12m;

    # Compiled Vite assets: long-lived, content-hashed.
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Health endpoints are served by the app; no special-casing needed.

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 60s;
    }

    # Never expose dotfiles or storage.
    location ~ /\.(?!well-known).* {
        deny all;
    }

    # Candidate documents are NEVER served from disk by the proxy — always
    # through the application route so the Policy check and audit write happen.
    location /storage/ {
        deny all;
    }
}
