# Portal Karir Kampus — top-level nginx config for the co-located production
# web role (DEPLOYMENT_ARCHITECTURE.md §2, §6).
#
# This file does NOT define application behaviour. It only:
#   1. provides the events{} / http{} context the frozen app-tier vhost needs,
#   2. relocates every writable path so nginx runs as the non-root www-data
#      user (no `user` directive: a non-root master cannot setuid, so workers
#      inherit www-data from the starting process),
#   3. includes infra/docker/nginx.conf verbatim as the single server{} block.
#
# The frozen vhost (root /var/www/app/public; fastcgi_pass 127.0.0.1:9000;
# listen 8080; /storage denied) is unchanged and authoritative.

worker_processes  auto;
pid               /tmp/nginx.pid;
error_log         /dev/stderr  warn;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Non-root writable locations (created + chowned in the image).
    client_body_temp_path  /tmp/nginx/client_body;
    proxy_temp_path        /tmp/nginx/proxy;
    fastcgi_temp_path      /tmp/nginx/fastcgi;
    uwsgi_temp_path        /tmp/nginx/uwsgi;
    scgi_temp_path         /tmp/nginx/scgi;

    access_log  /dev/stdout;

    sendfile           on;
    tcp_nopush         on;
    server_tokens      off;
    keepalive_timeout  65;
    types_hash_max_size 2048;

    # The FROZEN app-tier vhost — byte-for-byte infra/docker/nginx.conf.
    include /etc/nginx/http.d/app.conf;
}
