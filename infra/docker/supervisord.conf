# Portal Karir Kampus — process supervision for the co-located web role only
# (DEPLOYMENT_ARCHITECTURE.md §2). tini (PID 1, image ENTRYPOINT) -> supervisord
# -> { php-fpm -F, nginx -g 'daemon off;' }.
#
# worker / scheduler / ssr do NOT use this file — they override the container
# command and run a single foreground process directly under tini.

[supervisord]
# The container already runs as www-data (Dockerfile `USER www-data`), so
# supervisord and every child inherit that uid — no `user=` drop needed.
nodaemon=true
pidfile=/tmp/supervisord.pid
logfile=/dev/null
logfile_maxbytes=0
loglevel=info

[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[program:php-fpm]
command=php-fpm -F
autostart=true
autorestart=true
startretries=3
startsecs=3
stopsignal=QUIT
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
startretries=3
startsecs=3
stopsignal=QUIT
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

# Failure propagation: if either program exhausts its restarts and goes FATAL,
# terminate supervisord so the container exits and the orchestrator recreates
# it (compose: restart policy) instead of a half-dead web instance lingering.
[eventlistener:quit_on_failure]
events=PROCESS_STATE_FATAL
command=sh -c "printf 'READY\n'; read line; kill -SIGQUIT $PPID"
