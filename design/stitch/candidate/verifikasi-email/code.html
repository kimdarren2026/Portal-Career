<body class="bg-background min-h-screen flex items-center justify-center p-4">
<!-- Transactional Screen: Navigation Suppressed -->
<main class="w-full max-w-lg">
<!-- Logo Header -->
<div class="text-center mb-8">
<h1 class="font-headline-md text-headline-md font-bold text-deep-navy">Portal Kandidat</h1>
<p class="font-label-sm text-label-sm text-on-surface-variant mt-1">Tahun Akademik 2026</p>
</div>
<!-- Verification Card -->
<section class="bg-surface rounded-xl shadow-sm border border-outline-variant p-8 md:p-12 text-center relative overflow-hidden">
<!-- Background Decorative Element -->
<div class="absolute top-0 right-0 -mr-16 -mt-16 w-32 h-32 bg-primary/5 rounded-full blur-2xl pointer-events-none"></div>
<div class="absolute bottom-0 left-0 -ml-16 -mb-16 w-32 h-32 bg-secondary/5 rounded-full blur-2xl pointer-events-none"></div>
<!-- Icon -->
<div class="mx-auto w-20 h-20 bg-primary-fixed/30 rounded-full flex items-center justify-center mb-6 text-primary">
<span class="material-symbols-outlined text-[40px]" style="font-variation-settings: 'FILL' 1;">mark_email_read</span>
</div>
<!-- Content -->
<h2 class="font-headline-md text-headline-md text-on-surface mb-4">Verifikasi Email Anda</h2>
<p class="font-body-md text-body-md text-on-surface-variant mb-2">
                Kami telah mengirim tautan verifikasi ke:
            </p>
<p class="font-title-lg text-title-lg text-primary mb-6 break-all">
                budi.santoso@email.com
            </p>
<p class="font-body-md text-body-md text-on-surface-variant mb-8">
                Silakan buka email tersebut dan klik tautan verifikasi untuk mengaktifkan akun Anda.
            </p>
<!-- Actions -->
<div class="flex flex-col gap-4">
<button class="w-full inline-flex justify-center items-center gap-2 rounded-lg bg-primary py-3 px-4 font-label-md text-label-md text-on-primary hover:bg-primary-container transition-colors shadow-sm focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 focus:ring-offset-surface" type="button">
<span class="material-symbols-outlined text-[20px]">send</span>
                    Kirim Ulang Email Verifikasi
                </button>
<button class="w-full inline-flex justify-center items-center gap-2 rounded-lg border border-outline py-3 px-4 font-label-md text-label-md text-primary hover:bg-surface-container-low transition-colors focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 focus:ring-offset-surface" type="button">
<span class="material-symbols-outlined text-[20px]">edit</span>
                    Ganti Alamat Email
                </button>
</div>
</section>
<!-- Footer Note -->
<p class="text-center mt-8 font-label-sm text-label-sm text-outline">
            Belum menerima email? Periksa folder Spam atau Junk Anda.
        </p>
