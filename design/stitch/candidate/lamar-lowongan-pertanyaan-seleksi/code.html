<!DOCTYPE html>

<html lang="id"><head>

                    },
                    "borderRadius": {

                    },
                    "spacing": {
                        "margin-desktop": "48px",
                        "gutter": "24px",
                        "container-max": "1280px",

                    },
                    "fontFamily": {
                        "title-lg": ["Inter"],

<style>
        body { font-family: 'Inter', sans-serif; background-color: #f7fafc; color: #181c1e; }
        .stepper-line { position: absolute; top: 12px; left: 24px; right: 24px; height: 2px; background-color: #e0e3e5; z-index: 0; }
        .stepper-progress { position: absolute; top: 12px; left: 24px; width: 50%; height: 2px; background-color: #38a169; z-index: 1; transition: width 0.3s ease; }
    </style>
</head>
<body class="antialiased min-h-screen flex flex-col items-center py-12 px-margin-mobile md:px-margin-desktop">
<!-- Header Section -->
<header class="w-full max-w-container-max flex flex-col items-center mb-8 text-center">
<h1 class="font-headline-lg text-headline-lg text-primary mb-2">Melamar di Posisi Dosen Teknik Informatika</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant">Fakultas Ilmu Komputer</p>
</header>
<!-- Main Content Canvas -->
<main class="w-full max-w-[800px] bg-surface rounded-xl border border-outline-variant shadow-[0_4px_10px_rgba(0,0,0,0.02)] overflow-hidden">
<!-- Stepper Component -->
<div class="px-8 pt-8 pb-6 border-b border-surface-variant relative">
<div class="stepper-line"></div>
<div class="stepper-progress"></div>
<div class="flex justify-between items-start relative z-10">
<!-- Step 1: Completed -->
<div class="flex flex-col items-center gap-2 w-24">
<div class="w-6 h-6 rounded-full bg-success flex items-center justify-center text-on-primary">
<span class="material-symbols-outlined text-[14px] font-bold" data-icon="check" data-weight="fill" style="font-variation-settings: 'FILL' 1;">check</span>
</div>
<span class="font-label-sm text-label-sm text-on-surface-variant text-center">Periksa Profil</span>
</div>
<!-- Step 2: Completed -->
<div class="flex flex-col items-center gap-2 w-24">
<div class="w-6 h-6 rounded-full bg-success flex items-center justify-center text-on-primary">
<span class="material-symbols-outlined text-[14px] font-bold" data-icon="check" data-weight="fill" style="font-variation-settings: 'FILL' 1;">check</span>
</div>
<span class="font-label-sm text-label-sm text-on-surface-variant text-center">Pilih Dokumen</span>
</div>
<!-- Step 3: Active -->
<div class="flex flex-col items-center gap-2 w-24">
<div class="w-6 h-6 rounded-full bg-primary flex items-center justify-center text-on-primary border-4 border-surface ring-2 ring-primary">
<span class="font-label-sm text-label-sm">3</span>
</div>
<span class="font-label-md text-label-md text-primary text-center">Pertanyaan Seleksi</span>
</div>
<!-- Step 4: Pending -->
<div class="flex flex-col items-center gap-2 w-24">
<div class="w-6 h-6 rounded-full bg-surface-variant flex items-center justify-center text-outline">
<span class="font-label-sm text-label-sm">4</span>
</div>
<span class="font-label-sm text-label-sm text-outline text-center">Preview</span>
</div>
<!-- Step 5: Pending -->
<div class="flex flex-col items-center gap-2 w-24">
<div class="w-6 h-6 rounded-full bg-surface-variant flex items-center justify-center text-outline">
<span class="font-label-sm text-label-sm">5</span>
</div>
<span class="font-label-sm text-label-sm text-outline text-center">Kirim</span>
</div>
</div>
</div>
<!-- Form Area -->
<div class="p-8">
<h2 class="font-title-lg text-title-lg text-on-surface mb-6">Pertanyaan Seleksi Awal</h2>
<form class="space-y-6">
<!-- Question 1: Number -->
<div class="flex flex-col gap-2">
<label class="font-label-md text-label-md text-on-surface" for="q1">1. Berapa tahun pengalaman mengajar Anda? <span class="text-error">*</span></label>
<input class="w-full px-4 py-3 rounded-lg border border-outline-variant bg-surface-bright focus:border-primary focus:ring-1 focus:ring-primary font-body-md text-body-md text-on-surface transition-colors" id="q1" min="0" name="q1" placeholder="Contoh: 3" required="" type="number"/>
</div>
<!-- Question 2: Radio (Yes/No) -->
<div class="flex flex-col gap-3">
<span class="font-label-md text-label-md text-on-surface">2. Apakah Anda bersedia ditempatkan di luar kota? <span class="text-error">*</span></span>
<div class="flex gap-6">
<label class="flex items-center gap-2 cursor-pointer group">
<div class="relative flex items-center justify-center">
<input class="peer sr-only" name="q2" required="" type="radio" value="ya"/>
<div class="w-5 h-5 rounded-full border-2 border-outline peer-checked:border-primary peer-checked:bg-primary transition-all"></div>
<div class="absolute w-2 h-2 rounded-full bg-surface scale-0 peer-checked:scale-100 transition-transform"></div>
</div>
<span class="font-body-md text-body-md text-on-surface-variant group-hover:text-on-surface transition-colors">Ya</span>
</label>
<label class="flex items-center gap-2 cursor-pointer group">
<div class="relative flex items-center justify-center">
<input class="peer sr-only" name="q2" required="" type="radio" value="tidak"/>
<div class="w-5 h-5 rounded-full border-2 border-outline peer-checked:border-primary peer-checked:bg-primary transition-all"></div>
<div class="absolute w-2 h-2 rounded-full bg-surface scale-0 peer-checked:scale-100 transition-transform"></div>
</div>
<span class="font-body-md text-body-md text-on-surface-variant group-hover:text-on-surface transition-colors">Tidak</span>
</label>
</div>
</div>
<!-- Question 3: Long Text -->
<div class="flex flex-col gap-2">
<label class="font-label-md text-label-md text-on-surface" for="q3">3. Jelaskan motivasi Anda bergabung. <span class="text-error">*</span></label>
<textarea class="w-full px-4 py-3 rounded-lg border border-outline-variant bg-surface-bright focus:border-primary focus:ring-1 focus:ring-primary font-body-md text-body-md text-on-surface resize-y transition-colors" id="q3" name="q3" placeholder="Tuliskan motivasi Anda secara detail..." required="" rows="4"></textarea>
</div>
<!-- Question 4: Short Text (Optional) -->
<div class="flex flex-col gap-2">
<label class="font-label-md text-label-md text-on-surface" for="q4">4. Catatan tambahan <span class="text-outline font-normal">(Opsional)</span></label>
<input class="w-full px-4 py-3 rounded-lg border border-outline-variant bg-surface-bright focus:border-primary focus:ring-1 focus:ring-primary font-body-md text-body-md text-on-surface transition-colors" id="q4" name="q4" placeholder="Informasi tambahan jika ada..." type="text"/>
</div>
</form>
</div>
<!-- Action Footer -->
<div class="px-8 py-6 bg-surface-container-low border-t border-surface-variant flex justify-between items-center">
<button class="px-6 py-2.5 rounded-lg border border-outline text-on-surface hover:bg-surface-variant transition-colors font-label-md text-label-md flex items-center gap-2" type="button">
<span class="material-symbols-outlined text-[18px]" data-icon="arrow_back">arrow_back</span>
                Kembali
            </button>
<button class="px-6 py-2.5 rounded-lg bg-primary text-on-primary hover:bg-primary-container transition-colors font-label-md text-label-md flex items-center gap-2 shadow-sm" type="button">
                Lanjutkan
                <span class="material-symbols-outlined text-[18px]" data-icon="arrow_forward">arrow_forward</span>
</button>
</div>
</main>
<!-- Footer Note -->
<div class="mt-8 text-center font-label-sm text-label-sm text-outline">
        © 2026 Portal Kandidat. Data aman dan terenkripsi.
    </div>
</body></html>
